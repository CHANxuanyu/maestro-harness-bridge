name: CI

on:
  pull_request:
    branches: [main, rc, '*-RC', 'codex/i18n-zh-cn']
  workflow_dispatch:
  push:
    branches: [main, rc, 'codex/i18n-zh-cn', 'codex/conversation-feed']

permissions:
  contents: read

jobs:
  hb-release-policy:
    name: HB release policy
    if: github.repository == 'CHANxuanyu/maestro-harness-bridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node scripts/hb-release.mjs check
      - run: node --test scripts/hb-release.test.mjs

  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prettier --check .
      # Use the npm script rather than a bare `eslint src/` so CI and a local
      # `npm run lint:eslint` cannot drift apart. It chains the second,
      # dash-rule-only pass over src/__tests__ and scripts.
      - run: npm run lint:eslint
      - run: npm run lint # TypeScript type checking
      - run: npm run test:codex-shared
      # Agent briefing docs (CLAUDE*.md, docs/agent-guides/) are the first thing
      # every coding agent reads, and CLAUDE.md's list of canonical helpers is a
      # table of import paths. A moved file silently turns those into
      # instructions to import from nowhere, so the paths get checked here
      # rather than in the pre-push hook, which is routinely --no-verify'd past.
      - run: npm run lint:doc-refs

  test:
    name: Test (${{ matrix.os }}, shard ${{ matrix.shard }}/2)
    strategy:
      # Run the suite on both platforms; don't cancel one when the other fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test -- --shard=${{ matrix.shard }}/2

  native-e2e:
    name: Native resume E2E (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:e2e:fixtures
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: native-e2e-failure
          path: e2e-results/
          retention-days: 7
