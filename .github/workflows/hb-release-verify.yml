name: Verify HB release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published HB tag to verify, for example v1.0.1-hb.4'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: github.repository == 'CHANxuanyu/maestro-harness-bridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify published source, CI, assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: node scripts/hb-release.mjs verify --tag "$RELEASE_TAG" --state published
