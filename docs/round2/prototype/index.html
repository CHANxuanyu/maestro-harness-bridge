<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maestro 第二轮交互原型</title>
<meta name="prototype-version" content="P7.1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
	/* Maestro Clay Light, taken from src/shared/themes.ts */
	--bg: #faf9f5;
	--bg-side: #f3f1ea;
	--bg-raised: #eceae1;
	--line: #e0ddd2;
	--text: #1f1e1d;
	--dim: #6f6d66;
	--accent: #c2603e;
	--accent-soft: rgba(194, 96, 62, 0.12);
	--accent-text: #a3502f;
	--on-accent: #ffffff;
	--ok: #3f7a2e;
	--warn: #8a6100;
	--err: #b8392b;
	--seat-pm: #a3502f;
	--seat-dev: #2f5f96;
	--seat-qa: #6b4a9c;
	--shadow: 0 8px 28px rgba(31, 30, 29, 0.14);
	--font: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
	--mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
	/* layout: a slim prototype bar over the three-column shell (conversations, current conversation, side panel) */
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #262624; --bg-side: #1f1e1d; --bg-raised: #30302e; --line: #3d3c38;
		--text: #f5f4ef; --dim: #a6a39a; --accent: #d97757; --accent-soft: rgba(217, 119, 87, 0.18);
		--accent-text: #e8916f; --on-accent: #1f1e1d; --ok: #8fbf77; --warn: #e0b15c; --err: #e5675b;
		--seat-pm: #e8916f; --seat-dev: #8db4e2; --seat-qa: #bda3e6;
		--shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
		color-scheme: dark;
	}
}
:root[data-theme="dark"] {
	--bg: #262624; --bg-side: #1f1e1d; --bg-raised: #30302e; --line: #3d3c38;
	--text: #f5f4ef; --dim: #a6a39a; --accent: #d97757; --accent-soft: rgba(217, 119, 87, 0.18);
	--accent-text: #e8916f; --on-accent: #1f1e1d; --ok: #8fbf77; --warn: #e0b15c; --err: #e5675b;
	--seat-pm: #e8916f; --seat-dev: #8db4e2; --seat-qa: #bda3e6;
	--shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
	color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg-side); color: var(--text); font: 14px/1.55 var(--font); display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--mono); font-size: 0.92em; }
.dim { color: var(--dim); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* prototype bar */
.pbar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 16px; background: var(--bg-raised); border-bottom: 1px solid var(--line); }
.pbar .brand { font-weight: 600; font-size: 13px; margin-right: 4px; white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
.seg button { padding: 5px 11px; font-size: 13px; color: var(--dim); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.pbtn { padding: 5px 11px; font-size: 13px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); white-space: nowrap; }
.pbtn:hover { border-color: var(--dim); }
.pbtn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.pbtn[disabled] { opacity: 0.45; cursor: default; }
.pcheck { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--dim); white-space: nowrap; }
.pbar .grow { flex: 1 1 0; }
.pcount { font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.narr { flex: none; padding: 7px 16px; font-size: 13px; background: var(--bg-side); border-bottom: 1px solid var(--line); color: var(--dim); min-height: 34px; }
.narr b { color: var(--text); font-weight: 600; }

/* shell */
.app { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: 264px minmax(0, 1fr) 372px; background: var(--bg); }
.app.nopanel { grid-template-columns: 264px minmax(0, 1fr); }
.side { background: var(--bg-side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.side-top { padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 8px; }
.newconv { display: flex; align-items: center; gap: 8px; font-weight: 500; padding: 6px 8px; border-radius: 8px; }
.newconv:hover { background: var(--bg-raised); }
.search { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; color: var(--dim); font-size: 13px; }
.side-list { flex: 1 1 0; overflow-y: auto; padding: 4px 8px 12px; }
.proj { display: flex; align-items: center; gap: 6px; padding: 8px 6px 4px; font-weight: 600; font-size: 13px; }
.proj .n { font-weight: 400; color: var(--dim); }
.row { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: 8px; font-size: 13px; min-height: 32px; }
.row:hover { background: var(--bg-raised); }
.row.active { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.row .ttl { flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .br { flex: 0 1 auto; max-width: 96px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
.row .time { flex: none; color: var(--dim); font-size: 12px; }
.row.child { padding-left: 26px; }
.tmark { flex: none; width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; font-size: 10px; font-weight: 600; color: var(--on-accent); background: var(--accent); }
.tmark.cx { background: var(--seat-dev); }
.tmark.gl { background: var(--seat-qa); }
.tmark.team { background: var(--text); color: var(--bg); }
.wt { flex: none; color: var(--dim); font-size: 12px; }
.spin { flex: none; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--accent); border-right-color: transparent; animation: spin 0.9s linear infinite; }
.needdot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
@keyframes spin { to { transform: rotate(360deg); } }
.side-foot { flex: none; border-top: 1px solid var(--line); padding: 8px 12px; display: flex; justify-content: space-between; color: var(--dim); font-size: 12px; }

.center { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.head { flex: none; height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--bg-side); }
.head .ttl { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
.head .meta { color: var(--dim); font-size: 13px; white-space: nowrap; flex: none; }
.head .grow { flex: 1 1 0; }
.head .hbtn { color: var(--dim); font-size: 13px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; flex: none; }
.head .hbtn:hover { background: var(--bg-raised); color: var(--text); }
.hdot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.scroll { flex: 1 1 0; overflow-y: auto; padding: 22px 0 18px; }
.col { max-width: 760px; margin: 0 auto; padding: 0 20px; display: flex; flex-direction: column; gap: 14px; }
.bubble { align-self: flex-end; max-width: 82%; background: var(--bg-raised); border-radius: 14px; padding: 10px 14px; }
.answer p { margin: 0 0 8px; }
.answer ul { margin: 0; padding-left: 20px; }
.answer li { margin: 2px 0; }

/* current presentation replica */
.oldrow { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; font-size: 14px; }
.oldrow .ic { flex: none; width: 16px; color: var(--dim); text-align: center; }
.oldrow .vb { flex: none; color: var(--dim); }
.oldrow .arg { font-family: var(--mono); font-size: 13.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge-run { flex: none; color: var(--warn); font-weight: 500; }
.badge-run::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--warn); margin-right: 5px; }
.badge-fail { flex: none; color: var(--err); font-weight: 500; }
.oldthink { display: flex; align-items: center; gap: 8px; color: var(--dim); padding-top: 4px; font-variant-numeric: tabular-nums; }
.oldthink::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--warn); animation: blink 1s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.35; } }
.oldworked { color: var(--dim); }
.oldworked .f { color: var(--err); }

/* proposed activity line */
.act { display: block; width: 100%; border-radius: 10px; padding: 8px 10px; margin: 0 -10px; }
.act:hover { background: var(--bg-side); }
.act-l1 { display: flex; align-items: baseline; gap: 10px; }
.pulse { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); align-self: center; animation: blink 1.6s ease-in-out infinite; }
.act-intent { flex: 1 1 0; min-width: 0; }
.act-time { flex: none; color: var(--dim); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.act-l2 { display: flex; gap: 8px; color: var(--dim); font-size: 12.5px; padding-left: 18px; margin-top: 2px; white-space: nowrap; overflow: hidden; }
.act-l2 .cur { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); font-size: 12px; }
.steps { margin: 2px 0 0 8px; padding: 4px 0 4px 12px; border-left: 2px solid var(--line); display: flex; flex-direction: column; gap: 3px; }
.step { display: flex; gap: 8px; font-size: 12.5px; color: var(--dim); align-items: baseline; }
.step .arg { font-family: var(--mono); font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); opacity: 0.8; }
.step .note { flex: none; }
.step.say { color: var(--text); font-size: 13px; }
.worked { color: var(--dim); font-size: 13px; padding: 2px 0; border-radius: 6px; }
.worked:hover { color: var(--text); }
.deliver { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 2px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; background: var(--bg); white-space: nowrap; }
.chip.ok { color: var(--ok); border-color: currentColor; }
.chip.warn { color: var(--warn); border-color: currentColor; }
button.chip:hover { background: var(--bg-raised); }
.needyou { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.needyou h4 { margin: 0; font-size: 13px; color: var(--accent-text); font-weight: 600; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 12px; font-size: 13px; min-height: 32px; }
.btn:hover { border-color: var(--dim); }
.btn.pri { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.btn.chosen { border-color: var(--accent); color: var(--accent-text); font-weight: 600; }

/* composer */
.composer-wrap { flex: none; padding: 10px 20px 16px; border-top: 1px solid var(--line); background: var(--bg-side); }
.composer { max-width: 760px; margin: 0 auto; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); padding: 10px 12px 8px; position: relative; }
.composer textarea { width: 100%; border: 0; background: transparent; resize: none; font: inherit; color: inherit; height: 44px; }
.composer textarea:focus { outline: none; }
.crow { display: flex; align-items: center; gap: 6px; }
.crow .grow { flex: 1 1 0; }
.cpill { color: var(--dim); font-size: 13px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
.cpill:hover { background: var(--bg-raised); color: var(--text); }
.cpill .tag { font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 4px; }
.send { flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 600; }
.send.stop { background: var(--text); color: var(--bg); }
.to { font-size: 12.5px; color: var(--dim); padding-bottom: 6px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

/* model + effort picker */
.pop { position: absolute; right: 8px; bottom: calc(100% + 8px); width: min(640px, calc(100vw - 32px)); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); z-index: 30; overflow: hidden; }
.pop-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--dim); }
.pop-head input { flex: 1 1 0; border: 0; background: transparent; font: inherit; color: var(--text); min-width: 0; }
.pop-head input:focus { outline: none; }
.quota { flex: none; display: inline-flex; align-items: center; gap: 6px; }
.qbar { width: 46px; height: 5px; border-radius: 3px; background: var(--bg-raised); overflow: hidden; }
.qbar i { display: block; height: 100%; background: var(--ok); }
.pop-body { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); max-height: min(420px, 56vh); }
.mlist { overflow-y: auto; padding: 6px; border-right: 1px solid var(--line); }
.msec { font-size: 11.5px; color: var(--dim); padding: 8px 8px 2px; }
.mrow { display: block; width: 100%; padding: 7px 8px; border-radius: 8px; }
.mrow[aria-selected="true"] { background: var(--bg-raised); }
.mrow .n { display: flex; align-items: center; gap: 6px; font-weight: 500; }
.mrow .d { color: var(--dim); font-size: 12.5px; }
.mrow .ck { margin-left: auto; color: var(--accent-text); font-size: 12px; font-weight: 600; }
.mini { font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--dim); font-weight: 400; white-space: nowrap; }
.elist { overflow-y: auto; padding: 6px; }
.elist h5 { margin: 0; padding: 8px 8px 2px; font-size: 11.5px; color: var(--dim); font-weight: 400; }
.erow { display: block; width: 100%; padding: 6px 8px; border-radius: 8px; }
.erow[aria-selected="true"] { background: var(--bg-raised); }
.erow .n { display: flex; align-items: center; gap: 6px; font-weight: 500; }
.erow .d { color: var(--dim); font-size: 12.5px; }
.enote { margin: 6px 8px; padding: 6px 8px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-text); font-size: 12.5px; }
.pop-foot { display: flex; align-items: center; gap: 12px; padding: 7px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--dim); }
.pop-foot kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
.pop-foot .grow { flex: 1 1 0; }
.oldmenu { position: absolute; right: 120px; bottom: calc(100% + 8px); width: 210px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); z-index: 30; font-family: var(--mono); font-size: 12px; }
.oldmenu .hint { padding: 6px 12px; color: var(--dim); border-bottom: 1px solid var(--line); }
.oldmenu .it { padding: 6px 12px; }
.oldmenu .it.sel { color: var(--accent-text); background: var(--bg-raised); }
.oldmenu .typed { padding: 6px 12px; color: var(--dim); border-top: 1px solid var(--line); }
.oldmenu .lst { max-height: 168px; overflow-y: auto; }

/* side panel */
.panel { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--bg); }
.tabs { flex: none; height: 48px; display: flex; align-items: stretch; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--line); background: var(--bg-side); overflow-x: auto; }
.tab { padding: 0 10px; color: var(--dim); font-weight: 500; font-size: 13px; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tab .cnt { font-size: 11px; color: var(--dim); margin-left: 4px; }
.pbody { flex: 1 1 0; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
.pbody h3 { margin: 4px 0 0; font-size: 12px; font-weight: 600; color: var(--dim); }
.todo { display: flex; gap: 8px; align-items: baseline; }
.todo .box { flex: none; width: 14px; }
.todo.done { color: var(--dim); }
.todo.cur { font-weight: 600; }
.item { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; }
.item .top { display: flex; gap: 8px; align-items: baseline; }
.item .top .t { flex: 1 1 0; min-width: 0; font-weight: 500; }
.st { flex: none; font-size: 11.5px; border-radius: 4px; padding: 0 6px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
.st.ok { color: var(--ok); border-color: currentColor; }
.st.warn { color: var(--warn); border-color: currentColor; }
.st.err { color: var(--err); border-color: currentColor; }
.st.acc { color: var(--accent-text); border-color: currentColor; }
.src { font-size: 11.5px; color: var(--dim); }

/* team feed */
.strip { flex: none; display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 13px; overflow-x: auto; }
.phases { display: flex; align-items: center; gap: 4px; flex: none; }
.ph { padding: 2px 8px; border-radius: 999px; color: var(--dim); white-space: nowrap; font-size: 12.5px; }
.ph.done { color: var(--text); }
.ph.cur { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.ph-sep { color: var(--line); }
.strip .now { color: var(--dim); white-space: nowrap; flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.strip .need { flex: none; background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 2px 10px; font-weight: 600; font-size: 12.5px; white-space: nowrap; }
.seat { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; }
.seat i { width: 8px; height: 8px; border-radius: 2px; background: var(--seat-pm); display: inline-block; }
.seat.dev i { background: var(--seat-dev); border-radius: 50%; }
.seat.qa i { background: var(--seat-qa); transform: rotate(45deg); }
.seat .mdl { font-weight: 400; color: var(--dim); font-size: 12px; }
.msg { display: flex; flex-direction: column; gap: 3px; }
.msg .body { padding-left: 14px; }
.sys { color: var(--dim); font-size: 12.5px; padding-left: 14px; }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
.card > h4 { margin: 0; font-size: 12px; font-weight: 600; color: var(--dim); display: flex; gap: 8px; align-items: baseline; }
.card > h4 .k { color: var(--text); }
.card.need { border-color: var(--accent); background: var(--accent-soft); }
.card.need > h4 { color: var(--accent-text); }
.card.block { border-color: var(--warn); }
.card ul { margin: 0; padding-left: 18px; }
.card li { margin: 2px 0; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; font-size: 13px; }
.kv dt { color: var(--dim); }
.kv dd { margin: 0; }
.thread { border: 1px dashed var(--line); border-radius: 12px; }
.thread > button { display: flex; gap: 8px; width: 100%; padding: 9px 14px; align-items: baseline; }
.thread > button .t { flex: 1 1 0; min-width: 0; }
.thread > button .o { color: var(--dim); font-size: 12.5px; flex: none; }
.thread .in { padding: 4px 14px 12px; display: flex; flex-direction: column; gap: 12px; border-top: 1px dashed var(--line); }
.crit { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; font-size: 13px; align-items: baseline; }
.crit .id { color: var(--dim); font-family: var(--mono); font-size: 12px; }
.chain { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; }
.chain .lk { border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--dim); }
.chain .lk.on { color: var(--ok); border-color: currentColor; }
.chain .lk.bad { color: var(--err); border-color: currentColor; }
.chain .ar { color: var(--dim); }
.banner { border: 1px solid var(--line); background: var(--bg-raised); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
.fadein { animation: fadein 0.25s ease-out; }
@keyframes fadein { from { opacity: 0.4; transform: translateY(4px); } }

pre.out { margin: 0; padding: 8px 10px; background: var(--bg-raised); border-radius: 8px; font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-x: auto; }
.cmds { display: flex; flex-direction: column; gap: 4px; padding: 6px 10px; background: var(--bg-raised); border-radius: 8px; }

/* ---------- daily: one scripted turn ---------- */
const RUN = [

function stopRun() { S.run.timers.forEach(clearTimeout); S.run.timers = []; if (S.run.tick) clearInterval(S.run.tick); S.run.tick = null; }

function playRun() {
	resetRun();

	const push = (ev) => { S.run.events.push(ev); renderDaily(); };

			S.run.pending = RUN.slice(i);

	if (e.k === 'tool') {
		const ev = { ...e, state: 'running' };
		later(at, () => push(ev));
		later(at + e.dur, () => { ev.state = e.fail ? 'failed' : 'ok'; renderDaily(); });

	S.run.approvalOpen = false; S.run.approved = ok;

	const push = (ev) => { S.run.events.push(ev); renderDaily(); };

	rest.forEach((e) => { if (!ok && e.k === 'tool') return; schedule(e, e.t - base + 300, later, push); });

/* ---------- shared progress rules: PRD 3.1.3 to 3.1.5 ----------
   One judgement serves a single conversation, a team problem and PM review. It reads only what the app can observe:
   the concrete change or experiment (fp), what still fails afterwards (fails) and the evidence an attempt produced.
   An attempt's category and wording are kept for people to read; they never decide whether work continues. */
const VERDICT = { first: '第一次', solved: '已解决', fewer: '有进展：失败变少', changed: '有进展：失败变了，旧的没回来', evidence: '有进展：新证据', none: '无进展：结果没变，也没有新证据', regress: '无进展：回到了之前的报错', dup: '重复：不算新办法' };
const PROGRESS = ['solved', 'fewer', 'changed', 'evidence'];
const BOUNDARY = { budget: '整体预算或截止时间', commitment: '改变承诺', permission: '新权限', model: '新模型', login: '本人登录', baseline: '确认基线', acceptance: '演示验收' };
const sameSet = (a, b) => a.length === b.length && a.every((x) => b.includes(x));
function judgeAttempts(start, list) {
	let prev = start.slice(); const seen = new Set(start); const known = new Set(); let streak = 0; let rejects = 0; const out = [];
	for (const a of list) {
		if (a.diag) { streak = 0; rejects = 0; out.push({ ...a, verdict: 'diag', knownAfter: known.size, streak }); continue; }
		const fails = a.fails; const fresh = (a.evidence || []).filter((e) => !known.has(e));
		// the same concrete change, nothing learned since, the same result: a repeat, whatever it is called this time
		const twin = out.find((o) => !o.diag && o.fp === a.fp && o.knownAfter === known.size && sameSet(o.fails, fails));
		let v;
		if (twin && !fresh.length) v = 'dup';
		else if (!fails.length) v = 'solved';
		else if (fails.some((f) => seen.has(f) && !prev.includes(f))) v = 'regress';
		else if (fails.length < prev.length) v = 'fewer';

		const stepList = () => `<div class="steps">${run.events.map((e) => e.k === 'say' ? `<div class="step say">${esc(e.text)}</div>` : e.k === 'tool' ? `<div class="step"><span>${CAT[e.cat]}</span><span class="arg">${esc(e.arg)}</span>${e.state === 'failed' ? '<span class="note">退出码 1，属于预期（先写会失败的回归）</span>' : e.state === 'running' ? '<span class="note">进行中</span>' : ''}</div>` : '').join('')}</div>`;

				</button>${run.expanded ? stepList() : ''}</div>`;
			if (run.approvalOpen) body += `<div class="needyou fadein"><h4>需要你批准</h4><div>要运行 <span class="mono">npm run lint</span>。这条对话的权限是“标准”，命令需要你确认。</div><div class="btnrow"><button class="btn pri" data-act="approve" data-v="1">允许这一次</button><button class="btn" data-act="approve" data-v="0">拒绝</button></div></div>`;
		} else {

				+ `<div class="deliver"><button class="chip" data-act="ptab" data-v="changes">改动 2 个文件 <span class="dim">+9 −1</span></button><span class="chip ok">检查 15/15 通过</span><span class="chip warn">未做：Electron 场景</span></div>`;
		}
	}
	const r = resolved();
	const composer = `<div class="composer-wrap"><div class="composer">

/* ---------- model + effort picker ---------- */
function visibleModels() {
	const c = CATALOG[S.tool]; const q = S.pop.q.trim().toLowerCase();
	let ms = c.models.filter((m) => !q || (m.name + ' ' + m.id + ' ' + m.desc + ' ' + m.zh).toLowerCase().includes(q));
	if (!q && !S.pop.more) ms = ms.filter((m) => !m.more);
	return ms;
}
function popRows() {
	// row 0 is "follow the tool's default"; it stays unless a filter is typed
	const rows = []; if (!S.pop.q.trim()) rows.push({ dflt: true }); visibleModels().forEach((m) => rows.push({ m })); return rows;
}
function popHtml() {
	const c = CATALOG[S.tool]; const sel = S.sel[S.tool]; const rows = popRows();
	const dm = c.models.find((m) => m.id === c.defaultModel);
	const hi = rows[S.pop.mi] || rows[0]; const hm = hi && (hi.dflt ? dm : hi.m);
	const hasMore = c.models.some((m) => m.more);
	const mrow = (r, i) => {
		const on = i === S.pop.mi && S.pop.col === 'model';
		if (r.dflt) return `<button class="mrow" role="option" aria-selected="${i === S.pop.mi}" data-act="pick-model" data-i="${i}"><span class="n">跟随 ${c.label} 的默认<span class="mini">当前是 ${esc(dm.name)}</span>${!sel.model ? '<span class="ck">已选</span>' : ''}</span><span class="d">${c.label} 换默认模型时，这里跟着变</span></button>`;
		const m = r.m;
		return `<button class="mrow" role="option" aria-selected="${i === S.pop.mi}" data-act="pick-model" data-i="${i}"><span class="n">${esc(m.name)}${m.fast ? '<span class="mini">可开 Fast</span>' : ''}${sel.model === m.id ? '<span class="ck">已选</span>' : ''}</span><span class="d">${esc(m.zh || m.desc || '')}${m.notice ? '。' + esc(m.notice) : ''}</span></button>`;
	};
	let list = rows.map(mrow).join('');
	if (hasMore && !S.pop.q.trim()) list += `<button class="mrow" data-act="more"><span class="n dim">${S.pop.more ? '收起较早的模型' : '更多模型…'}</span></button>`;
	if (!rows.length) list = `<div class="msec">没有匹配的模型。按 Enter 把“${esc(S.pop.q)}”当作模型 ID 使用。</div>`;
	// effort column belongs to the highlighted model
	let ecol = '';
	if (hm) {
		const cur = sel.effort[hm.id] || hm.def;
		if (!hm.efforts.length) ecol = `<h5>${c.term}</h5><div class="msec">${esc(hm.name)} 没有强度选项。</div>`;
		else ecol = `<h5>${c.term} · ${esc(hm.name)}</h5>` + hm.efforts.map((e, i) => {
			const L = c.levels[e];
			return `<button class="erow" role="option" aria-selected="${S.pop.col === 'effort' ? i === S.pop.ei : e === cur}" data-act="pick-effort" data-e="${e}"><span class="n">${L[0]}${e === hm.def ? `<span class="mini">${S.tool === 'claude' ? 'Recommended' : '这个模型的默认'}</span>` : ''}${e === cur ? '<span class="ck">已选</span>' : ''}</span><span class="d">${esc(L[2])}</span></button>`;
		}).join('') + (hm.fast ? `<h5>速度</h5><button class="erow" data-act="fast"><span class="n">${S.tool === 'claude' ? 'Fast mode' : 'Fast'}<span class="mini">${sel.fast ? '已开' : '关'}</span></span><span class="d">${S.tool === 'claude' ? '更快出结果，用量更高' : esc(hm.fast === '1.5x speed' ? '1.5 倍速度' : '2 倍速度，用量增加')}</span></button>` : '');
		// say so before the switch when the highlighted model lacks the level in use now
		const now = resolved();
		if (hm.id !== now.m.id && now.eff && hm.efforts.length && !hm.efforts.includes(now.eff)) ecol = `<div class="enote">${esc(hm.name)} 没有 ${c.levels[now.eff][0]}。切过去会用它自己的 ${c.levels[cur][0]}。</div>` + ecol;
	}
	return `<div class="pop" role="dialog" aria-label="模型与强度" id="pop">
		<div class="pop-head"><span>⌕</span><input id="pop-filter" value="${esc(S.pop.q)}" placeholder="筛选 ${c.label} 的模型，或输入模型 ID" aria-label="筛选模型" autocomplete="off"><span class="quota" title="示例数据"><span class="qbar"><i style="width:${c.quota}%"></i></span>${c.quotaText}</span></div>
		<div class="pop-body"><div class="mlist" role="listbox" aria-label="模型">${list}</div><div class="elist" role="listbox" aria-label="${c.term}">${ecol}</div></div>
		<div class="pop-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> 选择</span><span><kbd>→</kbd> 到强度</span><span><kbd>Enter</kbd> 确定</span><span><kbd>Esc</kbd> 关闭</span><span class="grow"></span><span>${c.source}</span></div>
	</div>`;
}
function scrollSel() { const el = $('#pop [aria-selected="true"]'); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' }); }
function openPop() {
	const sel = S.sel[S.tool]; const rows = (S.pop.q = '', S.pop.more = false, popRows());
	let mi = 0; if (sel.model) { const m = CATALOG[S.tool].models.find((x) => x.id === sel.model); if (m && m.more) S.pop.more = true; mi = Math.max(0, popRows().findIndex((r) => r.m && r.m.id === sel.model)); }
	S.pop = { ...S.pop, open: true, col: 'model', mi, ei: 0, notice: '' }; renderDaily();
}
function closePop(refocus = true) { S.pop.open = false; renderDaily(); if (refocus) { const p = $('#pill'); if (p) p.focus(); } }
function chooseModel(i) {
	const rows = popRows(); const r = rows[i]; if (!r) return;
	// The level belongs to the model: each model remembers its own, the way the
	// vendors' own apps do. Nothing is carried from the previous model.
	S.sel[S.tool].model = r.dflt ? null : r.m.id;
	S.pop.notice = '';
	S.pop.mi = i;
}
function chooseEffort(e) { const rows = popRows(); const c = CATALOG[S.tool]; const hi = rows[S.pop.mi]; const m = hi.dflt ? c.models.find((x) => x.id === c.defaultModel) : hi.m; const sel = S.sel[S.tool]; if (e === m.def) delete sel.effort[m.id]; else sel.effort[m.id] = e; S.pop.notice = ''; }
function popKey(ev) {
	const rows = popRows(); const c = CATALOG[S.tool];
	const hi = rows[S.pop.mi]; const hm = hi && (hi.dflt ? c.models.find((x) => x.id === c.defaultModel) : hi.m);
	const k = ev.key;
	if (k === 'Escape') { ev.preventDefault(); ev.stopPropagation(); closePop(); return; }
	if (k === 'ArrowDown' || k === 'ArrowUp') {
		ev.preventDefault(); const d = k === 'ArrowDown' ? 1 : -1;
		if (S.pop.col === 'model') { S.pop.mi = Math.max(0, Math.min(rows.length - 1, S.pop.mi + d)); S.pop.notice = ''; }
		else if (hm) S.pop.ei = Math.max(0, Math.min(hm.efforts.length - 1, S.pop.ei + d));
		renderDaily(); return;
	}
	if ((k === 'ArrowRight' || k === 'Tab') && S.pop.col === 'model' && hm && hm.efforts.length && (k === 'Tab' || ev.target.selectionStart === ev.target.value.length)) {
		ev.preventDefault(); chooseModel(S.pop.mi); S.pop.col = 'effort'; const sel = S.sel[S.tool]; S.pop.ei = Math.max(0, hm.efforts.indexOf(sel.effort[hm.id] || hm.def)); renderDaily(); return;
	}
	if ((k === 'ArrowLeft' || (k === 'Tab' && ev.shiftKey)) && S.pop.col === 'effort') { ev.preventDefault(); S.pop.col = 'model'; renderDaily(); return; }
	if (k === 'Enter') {
		ev.preventDefault();
		if (!rows.length && S.pop.q.trim()) { S.pop.notice = ''; closePop(); return; }
		if (S.pop.col === 'model') chooseModel(S.pop.mi); else if (hm) chooseEffort(hm.efforts[S.pop.ei]);
		closePop(); return;
	}
}

		else if (tab === 'changes') body = S.run.status === 'done' ? `<div class="item"><div class="top"><span class="t mono">src/quitSave.ts</span><span class="st">+2 −1</span></div></div><div class="item"><div class="top"><span class="t mono">src/quitSave.test.ts</span><span class="st">+7 −0</span></div></div><button class="btn">让另一家复核这些改动</button>` : '<div class="dim">相对上次提交没有改动。</div>';
		else body = '<div class="dim">原型里没有做这个面板。</div>';
		$('#panel').innerHTML = tabsHtml([['changes', '改动', S.run.status === 'done' ? '2' : ''], ['files', '文件', ''], ['term', '终端', ''], ['tasks', '任务', started && S.tool === 'codex' ? `${done}/4` : ''], ['web', '预览', '']], tab, 'ptab') + `<div class="pbody">${body}</div>`;
		return;
	}
	if (S.scene === 'follow') {

		let body = '';

document.addEventListener('input', (ev) => {
	if (ev.target.id === 'pop-filter') { S.pop.q = ev.target.value; S.pop.mi = 0; S.pop.col = 'model'; S.pop.notice = ''; renderDaily(); }
	if (ev.target.id === 't2-input') { S.team.draft = ev.target.value; mentionUpdate(); }
});
document.addEventListener('keydown', (ev) => {
	const T = S.team;
	if (S.pop.open && S.scene === 'daily') { popKey(ev); return; }
	if (T.setup && T.sp) {
		const sp = T.sp; const rows = spRows(); const min = sp.slot === 'sub' ? -1 : 0; const eff = sp.mi >= 0 ? rows[sp.mi].m.efforts.filter((e) => e !== 'ultra') : [];
		if (ev.key === 'Escape') { ev.preventDefault(); const back = `#sp-${sp.seat}-${sp.slot}`; T.sp = null; renderOverlay(); const b = $(back); if (b) b.focus(); return; }
		if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); const dlt = ev.key === 'ArrowDown' ? 1 : -1; if (sp.col === 'model') { sp.mi = Math.max(min, Math.min(rows.length - 1, sp.mi + dlt)); sp.effort = null; } else sp.ei = Math.max(0, Math.min(eff.length - 1, sp.ei + dlt)); renderOverlay(); const s = $(sp.col === 'model' ? '#sp .mrow[aria-selected="true"]' : '#sp .erow[aria-selected="true"]'); if (s) s.focus(); return; }
		if ((ev.key === 'ArrowRight' || ev.key === 'Tab') && sp.col === 'model' && eff.length) { ev.preventDefault(); sp.col = 'effort'; sp.ei = Math.max(0, eff.indexOf(sp.effort || rows[sp.mi].m.def)); renderOverlay(); const s = $('#sp .erow[aria-selected="true"]'); if (s) s.focus(); return; }
		if (ev.key === 'ArrowLeft' && sp.col === 'effort') { ev.preventDefault(); sp.col = 'model'; renderOverlay(); const s = $('#sp .mrow[aria-selected="true"]'); if (s) s.focus(); return; }
		if (ev.key === 'Enter') { ev.preventDefault(); spCommit(); return; }
		return;
	}
	if (T.setup && ev.key === 'Escape') { closeSetup(); return; }
	if (T.setup && ev.key === 'Tab') { const list = [...document.querySelectorAll('.dlg textarea, .dlg select, .dlg input, .dlg button')].filter((x) => !x.disabled); const i = list.indexOf(document.activeElement); if (ev.shiftKey && i <= 0) { ev.preventDefault(); list[list.length - 1].focus(); } else if (!ev.shiftKey && i === list.length - 1) { ev.preventDefault(); list[0].focus(); } return; }
	// the same chord the product already uses for its model switcher
	if (S.scene === 'daily' && S.mode === 'new' && ev.altKey && ev.metaKey && (ev.key === '.' || ev.code === 'Period')) { ev.preventDefault(); openPop(); return; }
	const ae = document.activeElement; const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(ae && ae.tagName);
	if (S.scene === 'team' && ae && ae.id === 't2-input') {
		if (T.men >= 0 && T.menList && T.menList.length) { if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); T.men = (T.men + (ev.key === 'ArrowDown' ? 1 : -1) + T.menList.length) % T.menList.length; mentionUpdate(); return; } if (ev.key === 'Enter' || ev.key === 'Tab') { ev.preventDefault(); pickMention(T.menList[T.men]); return; } if (ev.key === 'Escape') { ev.preventDefault(); T.men = -1; $('#mention').innerHTML = ''; return; } }
		if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); sendMsg(); return; }
		if (ev.key === 'Escape') { ae.blur(); return; }
	}
	if (S.scene === 'team' && ae && ae.id === 'base-edit' && ev.key === 'Enter') { ev.preventDefault(); const b = $('[data-act="t2-saveedit"]'); if (b) b.click(); return; }
	if (typing || T.setup) return;
	if (S.scene === 'team') { if (ev.key === 'Escape' && T.view !== 'team') { const k = T.view; T.view = 'team'; renderAll(); const r = $(`#side [data-act="t2-view"][data-v="${k}"]`); if (r) r.focus(); return; } if (ev.key === 'ArrowRight' && !needOpen(teamSteps()[T.i])) teamGo(T.i + 1); if (ev.key === 'ArrowLeft') { stopAuto(); teamBack(); } }
	if (S.scene === 'follow') { const F = S.follow; const st = followSteps()[F.i]; if (ev.key === 'ArrowRight' && !(st.need && !F.choice[st.need])) $('[data-act="fnext"]').click(); if (ev.key === 'ArrowLeft') $('[data-act="fprev"]').click(); }
});
function fromHash() { const h = location.hash.replace('#', ''); if (['team', 'daily', 'follow'].includes(h)) S.scene = h; }
addEventListener('hashchange', () => { fromHash(); renderAll(); });
fromHash();
// open in a realistic working state: a finished turn in the proposed presentation
S.run.status = 'done'; S.run.elapsed = 14; S.run.events = RUN.filter((e) => e.k !== 'done').map((e) => (e.k === 'tool' ? { ...e, state: e.fail ? 'failed' : 'ok' } : { ...e }));
renderAll();
</script>
